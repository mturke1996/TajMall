name: CI - Typecheck, Lint, Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# the workflow token can read the repository and nothing else
permissions:
  contents: read

jobs:
  checks:
    name: Typecheck + Lint + Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (production dependencies, high and critical)
        run: npm run audit:deps

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Lint (eslint)
        run: npm run lint

      - name: Design system guard
        run: npm run verify:design

      - name: Offline checks (lists, contacts, rent periods, PDFs)
        run: |
          npm run verify:lists
          npm run verify:contacts
          npm run verify:tenant-period
          npm run verify:tenant-pdf
          npm run verify:pdf-adaptive
          npm run verify:payroll-pdf
          npm run verify:pdf-text
          npm run verify:audit-safe
          npm run verify:period-review
          npm run verify:occupancy
          npm run verify:monthly-report
          npm run verify:follow-up
          npm run verify:daily-cashbox
          npm run verify:app-security
          npm run verify:money-core
          npm run verify:contact-tags
          npm run verify:obligation-months
          npm run verify:party-stats
          npm run verify:party-profile
          npm run verify:directory-stats
          npm run verify:employee-profile
          npm run verify:contact-form
          npm run verify:contact-role-conversion
          npm run verify:party-contacts
          npm run verify:rent-summary-claim
          npm run verify:leave
          npm run verify:report-options
          npm run verify:executive-pdf
          npm run verify:revenues-expenses-pdf
          npm run verify:period-journal-contra
          npm run verify:exempt-client-logic
          npm run verify:people-wording
          npm run verify:period-journal-options
          npm run verify:billing-preview
          npm run verify:tenant-collection
          npm run verify:landlord-dues
          npm run verify:lease-settlement
          npm run verify:entry-guards
          npm run verify:payment-receipt
          npm run verify:contact-roles
          npm run verify:backup-coverage
          npm run verify:service-worker
          npm run preflight

      - name: Clock simulator (libfaketime)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends faketime

      # These suites were written with 2026 months and Friday/Saturday weekend rules, and the database makes rent
      # charges for the CURRENT year only. Run on the real date they fail for reasons that are not regressions:
      # the leave suite on a Sunday (UTC+2) and test:hardening / verify:rent-allocation from 1 January 2027. The
      # clock starts at a fixed Monday so a red build always means a real change. (The cold-restore suite is
      # date-independent and is checked on other dates by hand; see docs/ENGINEERING-STANDARDS.)
      - name: Database replica tests (proposed migrations, no live database; clock fixed at 2026-11-16)
        run: |
          t() { faketime '2026-11-16 12:00:00' "$@"; }
          t npm run test:payroll:local
          t npm run test:rollback
          t npm run test:leave
          t npm run test:hardening
          t npm run test:rent-integrity
          t node scripts/test-least-privilege.mjs --no-children
          t npm run verify:rent-allocation
          t npm run test:cold-restore

      - name: Build (next build)
        run: npm run build
        env:
          # لا حاجة لأسرار حقيقية: الصفحات الثابتة تنشئ عميل Supabase أثناء التوليد المسبق
          # ويفشل مع رابط فارغ، فتكفي قيم وهمية — البناء لا يتصل بأي قاعدة بيانات.
          # (a closed local port: the offline-shell check below serves this same build, and its session
          # lookups then fail at once instead of waiting on a network that is not there)
          NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:9"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
          NEXT_PUBLIC_APP_NAME: "Fluxen"
          NEXT_PUBLIC_DEFAULT_LOCALE: "ar"
          NEXT_PUBLIC_DEFAULT_CURRENCY: "LYD"

      - name: Offline shell in a real browser (service worker, offline page, update policy)
        run: npm run e2e:offline-shell
        env:
          PW_CHANNEL: chrome # the runner's installed Google Chrome; no browser download
