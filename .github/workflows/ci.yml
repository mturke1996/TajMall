name: CI - Typecheck, Lint, Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck + Lint + Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Lint (eslint)
        run: npm run lint

      - name: Design system guard
        run: npm run verify:design

      - name: Offline checks (lists, contacts, rent periods, PDFs)
        run: |
          npm run verify:lists
          npm run verify:contacts
          npm run verify:tenant-period
          npm run verify:tenant-pdf
          npm run verify:pdf-adaptive
          npm run verify:payroll-pdf
          npm run verify:audit-safe
          npm run verify:period-review
          npm run verify:occupancy
          npm run verify:monthly-report
          npm run verify:follow-up
          npm run verify:daily-cashbox
          npm run verify:billing-preview
          npm run verify:tenant-collection
          npm run verify:landlord-dues
          npm run verify:lease-settlement
          npm run verify:entry-guards
          npm run verify:payment-receipt
          npm run verify:contact-roles

      - name: Database replica tests (proposed migrations, no live database)
        run: |
          npm run test:payroll:local
          npm run test:rollback
          npm run verify:rent-allocation

      - name: Build (next build)
        run: npm run build
        env:
          # لا حاجة لأسرار حقيقية: الصفحات الثابتة تنشئ عميل Supabase أثناء التوليد المسبق
          # ويفشل مع رابط فارغ، فتكفي قيم وهمية — البناء لا يتصل بأي قاعدة بيانات.
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
          NEXT_PUBLIC_APP_NAME: "Fluxen"
          NEXT_PUBLIC_DEFAULT_LOCALE: "ar"
          NEXT_PUBLIC_DEFAULT_CURRENCY: "LYD"
