name: Desktop shell (Tauri) - check, test, lint

# Runs when the desktop shell changes. It builds on Linux and on Windows, the platform the app ships on:
# a compile or test failure that only appears on Windows must fail here, not on a user's machine.
on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    branches: [main]
    paths:
      - "src-tauri/**"
      - ".github/workflows/desktop.yml"

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shell:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Linux libraries for Tauri
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev libssl-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev libsoup-3.0-dev

      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: desktop-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: desktop-${{ runner.os }}-

      - name: Compile (the lock file must be up to date)
        run: cargo check --locked --all-targets

      - name: Tests (ids, paths, backups, capabilities, command list)
        run: cargo test --locked

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
